[package]
name = "extend-computer-agent"
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
dev-identity = []
account-relay = ["dep:reqwest", "dep:tungstenite", "dep:url"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
hkdf = "0.12"
mdns-sd = "0.17"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
socket2 = "0.6"
spake2 = "0.4"
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
tempfile = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"], optional = true }
url = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
security-framework = "3"

[[bin]]
name = "extend-computer"
path = "src/main.rs"
