[package]
name = "extend-computer-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
dev-identity = ["extend-computer-agent/dev-identity"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
extend-computer-agent = { path = "../.." }
mdns-sd = "0.17"
tempfile = "3"
anyhow = "1"
zeroize = "1"
if-addrs = "0.14"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
open = "5"
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }
