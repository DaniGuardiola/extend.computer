[package]
name = "extend-computer-agent"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
dev-identity = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
hkdf = "0.12"
mdns-sd = "0.17"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
spake2 = "0.4"
tempfile = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[[bin]]
name = "extend-computer"
path = "src/main.rs"
