name: Prepare desktop release
on:
  push:
    branches: [main]
    paths: [".changeset/**", "desktop/package.json", ".github/workflows/version.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: desktop-version
  cancel-in-progress: false
jobs:
  version:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action; compiler pinned below
        with:
          toolchain: 1.98.1
      - run: npm ci
      - run: |
          cargo fetch
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
      - name: Create or update the release PR
        run: bash scripts/prepare-release-pr.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
