[package]
name = "extend-android-engine"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
extend-computer-agent = { path = "../../../engine", features = ["account-relay"] }
hex = "0.4"
jni = "0.21.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
