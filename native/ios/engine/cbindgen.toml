# Regenerate include/ExtendEngine.h with native/ios/engine/generate-header.sh.
language = "C"
include_guard = "EXTEND_ENGINE_H"
header = """
/* Generated by cbindgen from native/ios/engine/src/lib.rs. Do not edit;
 * run native/ios/engine/generate-header.sh.
 *
 * String results are heap JSON, {"ok":<value>} or {"error":"<message>"},
 * released with ext_string_free. Byte results are ExtBuffers released with
 * ext_buffer_free; a NULL ptr means nothing queued or an error, reported via
 * the optional `error` out-param (plain message, release with ext_string_free).
 * String arguments are NUL-terminated UTF-8; NULL is an error. */"""
usize_is_size_t = true
cpp_compat = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
documentation_style = "c99"

[export]
include = ["ExtBuffer"]
