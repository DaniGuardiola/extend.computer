[package]
name = "extend-computer-display"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Windows display helper: streams the screen to the desktop app and shows a peer's screen"

[[bin]]
name = "ExtendComputerDisplay"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
extend-computer-agent = { path = "../../../engine" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D10",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
