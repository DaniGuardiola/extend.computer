[package]
name = "extend-computer-display"
version = "0.3.1"
edition = "2021"
license = "MIT"
publish = false
description = "Windows display helper: captures the screen and streams encoded video to the desktop app"

# Standalone: the root workspace and macOS CI never build Windows helpers.
[workspace]

[[bin]]
name = "ExtendComputerDisplay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
] }
windows-core = "0.61"

[profile.release]
codegen-units = 1
lto = true
