[package]
name = "extend-computer-input"
version = "0.3.1"
edition = "2021"
license = "MIT"
publish = false
description = "Windows input helper: injects and captures keyboard and mouse input for the desktop app"

# Standalone: the root workspace and macOS CI never build Windows helpers.
[workspace]

[[bin]]
name = "ExtendComputerCursor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
