# Windows helpers. Separate from the root workspace so macOS CI never builds them.
[workspace]
members = ["display", "input"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
serde_json = "1"
windows = "0.61"

[profile.release]
codegen-units = 1
lto = true
