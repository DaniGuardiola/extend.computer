[package]
name = "extend-computer-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
subtle = "2"
argon2 = "0.5"
axum = "0.8"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5.5", features = ["conditional-ui", "danger-user-presence-only-security-keys"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
