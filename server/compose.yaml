services:
  server:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      EXTEND_ORIGIN: "${EXTEND_ORIGIN:-http://localhost:8080}"
      EXTEND_SIGNUP_ENABLED: "${EXTEND_SIGNUP_ENABLED:-false}"
    volumes:
      - accounts:/data

volumes:
  accounts:
